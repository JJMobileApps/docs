<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>mLinkServer Help</title>
    <style>
        :root {
            --bg-top: #edf7ef;
            --bg-bottom: #f7fbf8;
            --panel: rgba(255, 255, 255, 0.94);
            --ink: #1c1f23;
            --muted: #59615c;
            --line: #d6e4da;
            --brand: #2e7d32;
            --brand-soft: #dff0e3;
            --brand-strong: #1f5f24;
            --shadow: 0 24px 60px rgba(45, 100, 55, 0.14);
            --radius-xl: 28px;
            --radius-lg: 20px;
            --max-width: 960px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", "Noto Sans KR", sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at top left, #ffffff 0, #ffffff 12%, transparent 42%),
                linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 60%, #eef6f0 100%);
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .page {
            width: min(calc(100% - 32px), var(--max-width));
            margin: 0 auto;
            padding: 28px 0 56px;
        }

        .hero,
        .card {
            background: var(--panel);
            border: 1px solid rgba(255, 255, 255, 0.76);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
        }

        .hero {
            padding: 34px;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            padding: 8px 14px;
            border-radius: 999px;
            background: var(--brand-soft);
            color: var(--brand);
            font-size: 14px;
            font-weight: 800;
        }

        h1 {
            margin: 18px 0 14px;
            font-size: clamp(32px, 5vw, 54px);
            line-height: 1.08;
        }

        p {
            color: var(--muted);
            font-size: 17px;
            line-height: 1.8;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
            margin-top: 24px;
        }

        .card {
            padding: 28px;
        }

        .card h2 {
            margin: 0 0 10px;
            font-size: 26px;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            margin-top: 18px;
            padding: 0 18px;
            border-radius: 999px;
            background: var(--brand);
            color: #fff;
            font-weight: 900;
        }

        @media (max-width: 760px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .page {
                width: min(calc(100% - 20px), var(--max-width));
                padding-top: 20px;
                padding-bottom: 40px;
            }

            .hero,
            .card {
                padding: 20px;
                border-radius: 22px;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <section class="hero">
            <div class="eyebrow">mLinkServer Help</div>
            <h1>Choose your help language.</h1>
            <p>
                Select Korean or English to open the matching help pages for the app.
            </p>
        </section>

        <section class="grid" aria-label="Language selection">
            <a class="card" href="./ko/">
                <h2>한국어 도움말</h2>
                <p>앱 화면 설명과 설정 안내를 한국어로 확인합니다.</p>
                <span class="button">열기</span>
            </a>
            <a class="card" href="./en/">
                <h2>English Help</h2>
                <p>Open the app guide and setup help in English.</p>
                <span class="button">Open</span>
            </a>
        </section>
    </main>
</body>
</html>

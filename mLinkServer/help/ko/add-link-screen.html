            gap: 10px;
            min-height: 46px;
            padding: 0 16px;
            border-radius: 999px;
            background: #fff;
            border: 1px solid var(--line);
            color: var(--brand);
            font-weight: 700;
            text-decoration: none;

            background: #f3f5fb;
        }

        .nav-icon {
            width: 28px;
            height: 28px;
            display: inline-grid;
            place-items: center;
            border-radius: 50%;
            background: var(--brand-soft);
            color: var(--brand-strong);
            font-size: 16px;
            font-weight: 900;

        .nav-title {

            font-size: 14px;
            font-weight: 600;
        }

        h2 {
            margin: 0 0 14px;
            font-size: 28px;
        }

        h3 {
            margin: 0 0 8px;
            font-size: 19px;
        }

        p,
        li {
            color: var(--muted);
            font-size: 16px;
            line-height: 1.8;
        }

        .screenshot {
            margin: 0;
        }

        .screenshot img {
            display: block;
            width: 100%;
            max-width: 760px;
            height: auto;
            margin: 0 auto;
            border-radius: 24px;
            border: 1px solid var(--line);
            background: #fff;
        }

        .section {
            margin-top: 24px;
        }

        .panel {
            padding: 28px;
        }

        .steps {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
            margin-top: 16px;
        }

        .step {
            display: grid;
            grid-template-columns: 46px minmax(0, 1fr);
            gap: 14px;
            min-height: 120px;
            padding: 18px;
            border: 1px solid var(--line);
            border-radius: var(--radius-lg);
            background: #fff;
        }

        .step-num {
            width: 46px;
            height: 46px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: var(--brand-soft);
            color: var(--brand-strong);
            font-size: 22px;
            font-weight: 900;
        }

        .feature-list {
            margin: 0;
            padding-left: 20px;
        }

        .feature-list li {
            margin: 8px 0;
        }

        .note {

            padding: 24px 28px;
            background: linear-gradient(180deg, var(--warn-soft), #fffdf7);
            border-color: #f0d9ad;
        }

        .note h2 {
            color: var(--warn);
        }

        @media (max-width: 860px) {

            }

            .nav-bar {

                align-items: stretch;
            }

            .nav-link {

            }

            .note,
            .nav-bar {

                border-radius: 22px;
            }

            h2 {
                font-size: 24px;
            }

            .step {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
